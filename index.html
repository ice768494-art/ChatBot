<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A fast AI chatbot powered by Groq.">
  <title>Nova AI — Chatbot</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="logo">✦</span><span>Nova AI</span></div>
      <button id="newChat" class="new-chat">＋ New chat</button>
      <div class="side-info">
        <div class="mini-card">
          <span>⚡</span>
          <div><b>Fast AI</b><small>Powered by Groq</small></div>
        </div>
      </div>
      <div class="sidebar-bottom">
        <span>🔒 API key stays on the server</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn mobile-only" aria-label="Open menu">☰</button>
        <div>
          <h1>Nova AI</h1>
          <p>Ask anything</p>
        </div>
        <button id="clearBtn" class="icon-btn" aria-label="Clear chat" title="Clear chat">⌫</button>
      </header>

      <section id="messages" class="messages">
        <div id="welcome" class="welcome">
          <div class="welcome-icon">✦</div>
          <h2>How can I help?</h2>
          <p>Ask a question, learn something new, or get help with code.</p>
          <div class="suggestions">
            <button>Explain Python loops simply</button>
            <button>Give me a cool website project idea</button>
            <button>Help me debug my code</button>
            <button>Teach me HTML and CSS</button>
          </div>
        </div>
      </section>

      <form id="chatForm" class="composer">
        <textarea id="prompt" rows="1" maxlength="6000" placeholder="Message Nova AI..." autocomplete="off"></textarea>
        <button id="sendBtn" type="submit" aria-label="Send">➤</button>
      </form>
      <p class="disclaimer">AI can make mistakes. Check important information.</p>
    </main>
  </div>

  <script src="/script.js"></script>
</body>
</html>
